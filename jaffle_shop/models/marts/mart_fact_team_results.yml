version: 2

models:
  - name: mart_fact_team_results
    description: "Resultados agregados por equipo y temporada."

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['team_id', 'season_id']

    columns:
      - name: team_id
        description: "Identificador del equipo."
        tests:
          - not_null

      - name: season_id
        description: "Identificador de la temporada."
        tests:
          - not_null

      - name: total_points
        description: "Puntos totales del equipo en la temporada."

      - name: goals_for
        description: "Goles a favor en la temporada."

      - name: goals_against
        description: "Goles en contra en la temporada."

      - name: wins
        description: "Partidos ganados."

      - name: draws
        description: "Partidos empatados."

      - name: losses
        description: "Partidos perdidos."
